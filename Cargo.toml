[package]
name = "disk-lens"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-deque = "0.8.8"
dashmap = "6.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
wry = "0.57.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
